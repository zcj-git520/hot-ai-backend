Name: tool-svc
Listen: :8004
Timeout: 30000
Host: 0.0.0.0
Port: 8004


# 数据库配置

  # 或使用环境变量
  # MySQL:
  #   DSN: "host=localhost port=3306 user=root password=password dbname=hot_ai charset=utf8mb4 parseTime=true"
DataSource:
  MySQL:
    DSN: root:shds@Admin123@tcp(192.168.50.109:13306)/hot_ai?charset=utf8mb4&parseTime=true&loc=Local
# 日志配置
Log:
  ServiceName: tool-svc
  Mode: console
  Level: info
  Encoding: plain

# CORS配置
Cors:
  AllowOrigins: "*"
  AllowMethods: "*"
  AllowHeaders: "*"
