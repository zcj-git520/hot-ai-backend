Name: content-svc
Host: 0.0.0.0
Port: 8001

# 数据库配置
DataSource:
  MySQL:
    DSN: root:shds@Admin123@tcp(192.168.50.109:13306)/hot_ai?charset=utf8mb4&parseTime=true&loc=Local
  MongoDB:
    URI: mongodb://localhost:27017
    Database: hot_ai_articles

# Redis 配置
Redis:
  Host: 192.168.41.63:16379
  Type: node

# 日志配置
Log:
  Mode: file
  Path: logs/content-svc.log
  Level: info
  Encoding: json

# JWT 配置 (用于中间件解析 token，决定访问级别)
Auth:
  AccessSecret: your-secret-key-change-in-production
  AccessExpire: 86400

# 付费墙开关
# true: 按 user level 拦截（L0/L1 看不了 L2 内容）
# false: 全员可读完整内容（默认）
Paywall:
  Enabled: false
