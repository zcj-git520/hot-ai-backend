version: '3.8'

services:
  # ========== 服务发现 ==========
  consul:
    image: consul:1.17
    container_name: hot-ai-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0 -dev
    networks:
      - hot-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: hot-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: hot_ai
      MYSQL_USER: hot_ai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotai123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - hot-ai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: hot-ai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root123}
      MONGO_INITDB_DATABASE: hot_ai_articles
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hot-ai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: hot-ai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hot-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: hot-ai-prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hot-ai-network

  grafana:
    image: grafana/grafana:latest
    container_name: hot-ai-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    networks:
      - hot-ai-network
    depends_on:
      - prometheus

  # ========== 应用服务 ==========
  # Content Service - 内容微服务
  content-svc:
    build:
      context: .
      dockerfile: Dockerfile.content-svc
    container_name: hot-ai-content-svc
    environment:
      - DB_DSN=${DB_USER:-hot_ai}:${DB_PASSWORD:-hotai123}@tcp(mysql:3306)/hot_ai?charset=utf8mb4&parseTime=True&loc=Local
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hot-ai-network
    restart: unless-stopped

  # Learning Path Service - 学习路径微服务
  learning-path-svc:
    build:
      context: .
      dockerfile: Dockerfile.learning-path-svc
    container_name: hot-ai-learning-path-svc
    environment:
      - MYSQL_DSN=${DB_USER:-hot_ai}:${DB_PASSWORD:-hotai123}@tcp(mysql:3306)/hot_ai?charset=utf8mb4&parseTime=True&loc=Local
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hot-ai-network
    restart: unless-stopped

  # Gateway - API网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: hot-ai-gateway
    environment:
      - DB_DSN=${DB_USER:-hot_ai}:${DB_PASSWORD:-hotai123}@tcp(mysql:3306)/hot_ai?charset=utf8mb4&parseTime=True&loc=Local
      - CONTENT_SVC_URL=http://content-svc:8001
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      content-svc:
        condition: service_started
    networks:
      - hot-ai-network
    restart: unless-stopped

  # Nginx - 反向代理和负载均衡
  nginx:
    image: nginx:alpine
    container_name: hot-ai-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway
      - content-svc
    networks:
      - hot-ai-network
    restart: unless-stopped

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  hot-ai-network:
    driver: bridge
