openapi: 3.0.3
info:
  title: Hot AI Backend API
  description: |
    Hot AI 后端服务 API 接口文档
    
    ## 认证说明
    除了注册和登录接口外，其他接口都需要在请求头中携带 JWT Token：
    ```
    Authorization: Bearer <your_access_token>
    ```
    
    Token 有效期为 24 小时，过期后可以使用 Refresh Token 刷新。
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://api.hot-ai.com/api/v1
    description: 生产环境

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 用户
    description: 用户信息管理相关接口
  - name: 文章
    description: 文章资讯相关接口
  - name: 职业风险
    description: 职业风险分析相关接口

paths:
  /auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: |-
        创建新用户账号
        
        ## 注册流程说明
        1. 先调用 `/auth/send-registration-code` 发送邮箱验证码
        2. 用户收到验证码后，调用此接口提交注册信息
        3. 验证码有效期为 5 分钟，且只能使用一次
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: SecurePass123!
              password_confirm: SecurePass123!
              nickname: 用户名
              verification_code: "123456"
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user_id: user-123
                message: 注册成功，请登录
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 邮箱格式不正确
                data: null

  /auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 用户登录获取访问令牌
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in: 86400
                user:
                  id: user-123
                  email: user@example.com
                  nickname: 测试用户
                  avatar: ""
                  roles:
                    - user
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 邮箱或密码格式错误
                data: null
        '401':
          description: 认证失败（邮箱或密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 401
                message: 邮箱或密码错误
                data: null

  /auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 Token
      description: 使用 Refresh Token 获取新的 Access Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in: 86400
        '401':
          description: Refresh Token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 401
                message: Refresh Token 无效或已过期
                data: null

  /auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      description: 退出登录，使当前 Token 失效
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 200
                message: 登出成功
                data:
                  success: true
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 401
                message: 未授权访问
                data: null

  /user/profile:
    get:
      tags:
        - 用户
      summary: 获取用户资料
      description: 获取当前登录用户的详细信息
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

    put:
      tags:
        - 用户
      summary: 更新用户资料
      description: 更新当前登录用户的个人信息
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /user/preferences:
    put:
      tags:
        - 用户
      summary: 更新用户偏好
      description: 更新当前登录用户的偏好设置
      operationId: updateUserPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /user/change-password:
    post:
      tags:
        - 用户
      summary: 修改密码
      description: 修改当前登录用户的密码
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          description: 未授权或原密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /user/favorites:
    get:
      tags:
        - 用户
      summary: 获取收藏列表
      description: 获取当前登录用户的收藏列表
      operationId: getUserFavorites
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: 收藏类型过滤（可选）
          schema:
            type: string
            enum:
              - article
              - video
              - course
        - name: page
          in: query
          description: 页码（默认 1）
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页数量（默认 20）
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

    post:
      tags:
        - 用户
      summary: 添加收藏
      description: 添加一个新的收藏
      operationId: addFavorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFavoriteRequest'
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  favorite:
                    $ref: '#/components/schemas/FavoriteItem'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /user/favorites/{id}:
    delete:
      tags:
        - 用户
      summary: 删除收藏
      description: 删除指定的收藏
      operationId: deleteFavorite
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 收藏 ID
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: 收藏不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

# ============ 文章模块接口 ============
  /articles/categories:
    get:
      tags:
        - 文章
      summary: 获取文章分类列表
      description: 获取所有启用的文章分类,用于前端筛选按钮展示
      operationId: getArticleCategories
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /articles:
    get:
      tags:
        - 文章
      summary: 获取文章列表
      description: |-
        分页获取文章列表,支持按分类筛选
        
        ## 分类代码说明
        - `news`: AI动态
        - `impact`: 职业影响
        - `learn`: 学习资源
        - `tool`: 工具产品
      operationId: getArticles
      parameters:
        - name: page
          in: query
          description: 页码(从1开始)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: 分类代码(news/impact/learn/tool),不传则返回全部
          required: false
          schema:
            type: string
            enum: [news, impact, learn, tool]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Article'
                      total:
                        type: integer
                        description: 总记录数
                        example: 100
                      page:
                        type: integer
                        description: 当前页码
                        example: 1
                      page_size:
                        type: integer
                        description: 每页数量
                        example: 10
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /articles/{id}:
    get:
      tags:
        - 文章
      summary: 获取文章详情
      description: 根据文章ID获取详细信息,会自动增加阅读量
      operationId: getArticleById
      parameters:
        - name: id
          in: path
          description: 文章ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ArticleDetail'
        '404':
          description: 文章不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  # ============ 职业风险模块接口 ============
  /professions/categories:
    get:
      tags:
        - 职业风险
      summary: 获取职业分类列表
      description: 获取所有职业分类信息
      operationId: getProfessionCategories
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionCategory'
              example:
                - id: 1
                  name: 技术类
                  description: 技术开发、运维等相关职业
                  sort_order: 1
                  status: 1

  /professions/risk-levels:
    get:
      tags:
        - 职业风险
      summary: 获取风险等级信息
      description: 获取所有风险等级及其说明
      operationId: getRiskLevels
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskLevelInfo'
              example:
                - id: extreme
                  level: extreme
                  name: 极高风险
                  icon: 🔴
                  description: 该职业面临极高的自动化替代风险
                  color: '#EF4444'
                  min_score: 80
                  max_score: 100

  /professions:
    get:
      tags:
        - 职业风险
      summary: 获取职业列表
      description: 获取职业列表，支持分页、分类筛选、风险等级筛选和关键词搜索
      operationId: getProfessions
      parameters:
        - name: page
          in: query
          description: 页码(从1开始)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: page_size
          in: query
          description: 每页数量(1-100)
          required: false
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 100
          example: 12
        - name: category_id
          in: query
          description: 分类ID
          required: false
          schema:
            type: integer
          example: 1
        - name: risk_level
          in: query
          description: 风险等级(extreme/high/medium/low)
          required: false
          schema:
            type: string
            enum: [extreme, high, medium, low]
          example: high
        - name: keyword
          in: query
          description: 关键词搜索
          required: false
          schema:
            type: string
          example: 程序员
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionListResponse'

  /professions/search:
    get:
      tags:
        - 职业风险
      summary: 搜索职业
      description: 根据关键词搜索职业
      operationId: searchProfessions
      parameters:
        - name: q
          in: query
          description: 搜索关键词
          required: true
          schema:
            type: string
          example: 程序员
        - name: page
          in: query
          description: 页码
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: page_size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 12
          example: 12
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionListResponse'
        '400':
          description: 缺少搜索关键词
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /professions/{slug}:
    get:
      tags:
        - 职业风险
      summary: 获取职业详情
      description: 根据 slug 获取职业详细信息，包括影响分析、转型建议和市场数据
      operationId: getProfessionBySlug
      parameters:
        - name: slug
          in: path
          description: 职业唯一标识(slug)
          required: true
          schema:
            type: string
          example: software-engineer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionDetailResponse'
        '404':
          description: 职业不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /auth/forgot-password:
    post:
      tags:
        - 认证
      summary: 忘记密码
      description: |-
        发送重置密码邮件到指定邮箱
        
        ## 安全说明
        - 为了安全考虑，无论邮箱是否注册，都会返回成功提示
        - 防止攻击者通过此接口枚举已注册用户
        
        ## 限流规则
        - 同一邮箱 1 小时内最多发送 1 次
        
        ## 重置链接说明
        - 重置链接包含一次性 token
        - token 有效期为 1 小时
        - 点击重置链接后，token 立即失效
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 需要重置密码的邮箱地址
                  example: user@example.com
            example:
              email: user@example.com
      responses:
        '200':
          description: 重置邮件发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 如果该邮箱已注册，重置密码邮件将发送至您的邮箱
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 邮箱格式不正确
                data: null
        '429':
          description: 操作过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 429
                message: 操作过于频繁，请 1 小时后再试
                data: null

  /auth/reset-password:
    post:
      tags:
        - 认证
      summary: 重置密码
      description: |-
        使用重置 token 设置新密码
        
        ## 密码要求
        - 长度：8-20 位
        - 必须包含大写字母、小写字母、数字、特殊字符
        
        ## 注意事项
        - 重置 token 只能使用一次
        - token 有效期为 1 小时
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
                - password_confirm
              properties:
                token:
                  type: string
                  description: 重置密码 token（从邮件链接中获取）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                password:
                  type: string
                  format: password
                  description: 新密码
                  minLength: 8
                  maxLength: 20
                  example: NewSecurePass123!
                password_confirm:
                  type: string
                  format: password
                  description: 确认密码
                  example: NewSecurePass123!
            example:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              password: NewSecurePass123!
              password_confirm: NewSecurePass123!
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 密码重置成功，请登录
        '400':
          description: 请求参数错误或密码强度不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 两次输入的密码不一致
                data: null
        '404':
          description: 无效的或过期的重置 token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 404
                message: 重置链接已过期或无效
                data: null

  /auth/send-registration-code:
    post:
      tags:
        - 认证
      summary: 发送注册验证码
      description: |-
        向指定邮箱发送注册验证码，用于验证邮箱所有权
        
        ## 限流规则
        - 同一邮箱 1 分钟内最多发送 1 次
        - 同一邮箱 1 小时内最多发送 5 次
        
        ## 验证码说明
        - 验证码为 6 位数字
        - 有效期 5 分钟
        - 一次性使用，验证后自动失效
      operationId: sendRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 需要验证的邮箱地址
                  example: user@example.com
            example:
              email: user@example.com
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 验证码已发送，请检查邮箱
                  email:
                    type: string
                    example: user@example.com
                  expires_in:
                    type: integer
                    description: 验证码有效期（秒）
                    example: 300
        '400':
          description: 请求参数错误或邮箱已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 该邮箱已注册
                data: null
        '429':
          description: 操作过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 429
                message: 操作过于频繁，请稍后再试
                data: null

  /auth/send-verification-email:
    post:
      tags:
        - 认证
      summary: 发送验证邮件
      description: 向指定邮箱发送验证邮件，用于验证邮箱所有权
      operationId: sendVerificationEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 需要验证的邮箱地址
                  example: user@example.com
            example:
              email: user@example.com
      responses:
        '200':
          description: 邮件发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 验证邮件已发送，请检查邮箱
                  email:
                    type: string
                    example: user@example.com
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 邮箱格式不正确
                data: null
        '429':
          description: 请求过于频繁（限流）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 429
                message: 操作过于频繁，请稍后再试
                data: null

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  schemas:
    # ============ 请求模型 ============
    RegisterRequest:
      type: object
      description: 用户注册请求
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          format: password
          description: 密码
          minLength: 8
          maxLength: 32
          example: SecurePass123!
        nickname:
          type: string
          description: 用户昵称
          minLength: 2
          maxLength: 20
          example: 用户名

    LoginRequest:
      type: object
      description: 用户登录请求
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          format: password
          description: 密码
          example: SecurePass123!

    RefreshTokenRequest:
      type: object
      description: 刷新 Token 请求
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ============ 响应模型 ============
    RegisterResponse:
      type: object
      description: 注册响应
      properties:
        user_id:
          type: string
          description: 用户 ID
          example: user-123
        message:
          type: string
          description: 消息
          example: 注册成功，请登录

    LoginResponse:
      type: object
      description: 登录响应
      properties:
        access_token:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: 过期时间（秒）
          example: 86400
        user:
          $ref: '#/components/schemas/UserInfo'

    RefreshTokenResponse:
      type: object
      description: 刷新 Token 响应
      properties:
        access_token:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: 过期时间（秒）
          example: 86400

    CommonResponse:
      type: object
      description: 通用响应结构
      properties:
        code:
          type: integer
          description: 状态码
          example: 200
        message:
          type: string
          description: 消息
          example: 操作成功
        data:
          type: object
          description: 数据
          nullable: true

    UserInfo:
      type: object
      description: 用户基本信息
      properties:
        id:
          type: string
          description: 用户 ID
          example: user-123
        email:
          type: string
          format: email
          description: 邮箱
          example: user@example.com
        nickname:
          type: string
          description: 昵称
          example: 测试用户
        avatar:
          type: string
          description: 头像 URL
          example: ""
        roles:
          type: array
          description: 角色列表
          items:
            type: string
          example:
            - user

    UserDetail:
      type: object
      description: 用户详细信息
      properties:
        id:
          type: string
          description: 用户 ID
          example: user-123
        email:
          type: string
          format: email
          description: 邮箱
          example: user@example.com
        nickname:
          type: string
          description: 昵称
          example: 测试用户
        avatar:
          type: string
          description: 头像 URL
          example: https://example.com/avatar.jpg
        bio:
          type: string
          description: 个人简介
          example: 这是一个开发者
        status:
          type: string
          description: 账号状态
          enum:
            - active
            - inactive
            - banned
          example: active
        email_verified:
          type: boolean
          description: 邮箱是否已验证
          example: true
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        created_at:
          type: string
          format: date-time
          description: 创建时间
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: "2024-01-02T00:00:00Z"

    UserProfileUpdateRequest:
      type: object
      description: 更新用户资料请求
      properties:
        nickname:
          type: string
          description: 昵称
          minLength: 2
          maxLength: 20
          example: 新昵称
        avatar:
          type: string
          description: 头像 URL
          example: https://example.com/avatar.jpg
        bio:
          type: string
          description: 个人简介
          maxLength: 500
          example: 这是一个开发者

    UserPreferencesUpdateRequest:
      type: object
      description: 更新用户偏好请求
      properties:
        interested_categories:
          type: array
          description: 感兴趣的分类
          items:
            type: string
          example:
            - AI
            - 技术
        followed_professions:
          type: array
          description: 关注的行业
          items:
            type: string
          example:
            - 互联网
            - 教育
        email_notifications:
          $ref: '#/components/schemas/EmailNotificationSettings'
        theme:
          type: string
          description: 主题
          enum:
            - light
            - dark
          example: light
        language:
          type: string
          description: 语言
          example: zh-CN

    UserPreferences:
      type: object
      description: 用户偏好设置
      properties:
        interested_categories:
          type: array
          description: 感兴趣的分类
          items:
            type: string
          example:
            - AI
            - 技术
        followed_professions:
          type: array
          description: 关注的行业
          items:
            type: string
          example:
            - 互联网
            - 教育
        email_notifications:
          $ref: '#/components/schemas/EmailNotificationSettings'
        theme:
          type: string
          description: 主题
          enum:
            - light
            - dark
          example: light
        language:
          type: string
          description: 语言
          example: zh-CN

    EmailNotificationSettings:
      type: object
      description: 邮件通知设置
      properties:
        system_update:
          type: boolean
          description: 系统更新通知
          example: true
        new_content:
          type: boolean
          description: 新内容通知
          example: true
        weekly_digest:
          type: boolean
          description: 周报
          example: true

    ChangePasswordRequest:
      type: object
      description: 修改密码请求
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: 原密码
          example: OldSecurePass123!
        new_password:
          type: string
          format: password
          description: 新密码
          minLength: 8
          maxLength: 20
          example: NewSecurePass123!

    FavoriteItem:
      type: object
      description: 收藏项
      properties:
        id:
          type: string
          description: 收藏 ID
          example: fav-123
        user_id:
          type: string
          description: 用户 ID
          example: user-123
        type:
          type: string
          description: 收藏类型
          enum:
            - article
            - video
            - course
          example: article
        target_id:
          type: string
          description: 目标资源 ID
          example: article-456
        target_title:
          type: string
          description: 目标资源标题
          example: AI 发展趋势报告
        target_summary:
          type: string
          description: 目标资源摘要
          example: 这是一篇关于 AI 发展的文章
        tags:
          type: array
