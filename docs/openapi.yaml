        salary_impact:
          type: string
          description: 薪资影响
          enum: [positive, neutral, negative]
          example: positive
        salary_change_rate:
          type: number
          format: float
          description: 薪资变化率(%)
          example: 8.5
        avg_salary:
          type: number
          format: float
          description: 平均薪资(元)
          example: 25000
        job_demand_trend:
          type: string
          description: 就业需求趋势
          example: 上升
        supply_demand_ratio:
          type: number
          format: float
          description: 供需比
          example: 1.2
        data_source:
          type: string
          description: 数据来源
          example: 拉勾网、BOSS直聘
        data_update_date:
          type: string
          format: date
          description: 数据更新日期
          example: '2026-04-01'

    ProfessionDetail:
      type: object
      description: 职业详细信息
      allOf:
        - $ref: '#/components/schemas/ProfessionBrief'
        - type: object
          properties:
            impact_analysis:
              $ref: '#/components/schemas/ProfessionImpactAnalysis'
            transition_advice:
              $ref: '#/components/schemas/ProfessionTransitionAdvice'
            market_data:
              $ref: '#/components/schemas/ProfessionMarketData'
            created_at:
              type: string
              format: date-time
              description: 创建时间
              example: '2026-04-08T10:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: 更新时间
              example: '2026-04-08T10:00:00Z'

    ProfessionListResponse:
      type: object
      description: 职业列表响应
      properties:
        code:
          type: integer
          description: 响应码
          example: 200
        message:
          type: string
          description: 响应消息
          example: success
        data:
          type: object
          properties:
            professions:
              type: array
              description: 职业列表
              items:
                $ref: '#/components/schemas/ProfessionBrief'
            total:
              type: integer
              description: 总数
              example: 50
            page:
              type: integer
              description: 当前页码
              example: 1
            page_size:
              type: integer
              description: 每页数量
              example: 12

    ProfessionDetailResponse:
      type: object
      description: 职业详情响应
      properties:
        code:
          type: integer
          description: 响应码
          example: 200
        message:
          type: string
          description: 响应消息
          example: success
        data:
          $ref: '#/components/schemas/ProfessionDetail'

# ============ 全局错误响应 ============
x-error-codes:
  200: 请求成功
  400: 请求参数错误
  401: 未授权或认证失败
  403: 权限不足
  404: 资源不存在
  500: 服务器内部错误
