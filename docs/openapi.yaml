          description: 当前页码
          example: 1
        page_size:
          type: integer
          description: 每页数量
          example: 20
        favorites:
          type: array
          description: 收藏列表
          items:
            $ref: '#/components/schemas/FavoriteItem'

    CreateFavoriteRequest:
      type: object
      description: 创建收藏请求
      required:
        - type
