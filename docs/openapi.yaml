          example: true
        new_content:
          type: boolean
          description: 新内容通知
          example: true
        weekly_digest:
          type: boolean
          description: 周报
          example: true

    ChangePasswordRequest:
      type: object
      description: 修改密码请求
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: 原密码
          example: OldSecurePass123!
        new_password:
          type: string
          format: password
          description: 新密码
          minLength: 8
          maxLength: 20
          example: NewSecurePass123!

    FavoriteItem:
      type: object
