        - target_title
      properties:
        type:
          type: string
          description: 收藏类型
          enum:
            - article
            - video
            - course
          example: article
        target_id:
          type: string
          description: 目标资源 ID
          example: article-123
        target_title:
          type: string
          description: 目标资源标题
          example: AI 发展趋势报告
        target_summary:
          type: string
          description: 目标资源摘要
          example: 这是一篇关于 AI 发展的文章
        tags:
          type: array
          description: 标签列表
          items:
            type: string
          example:
            - AI
            - 技术
        note:
          type: string
          description: 备注
          example: 很重要的文章

    # ============ 文章模块数据模型 ============
    Category:
      type: object
      description: 文章分类
      properties:
        id:
          type: integer
          description: 分类ID
          example: 1
        name:
          type: string
          description: 分类名称
          example: 动态
        code:
          type: string
          description: 分类代码(用于API筛选)
          example: news
        color:
          type: string
          description: 颜色值(十六进制)
          example: '#3B82F6'
        icon:
          type: string
          description: 图标名称
          example: news
        sort_order:
          type: integer
          description: 排序顺序
          example: 1
        status:
          type: integer
          description: 状态(0-禁用, 1-启用)
          example: 1

    Tag:
      type: object
      description: 标签
      properties:
        id:
          type: integer
          format: int64
          description: 标签ID
          example: 1
        name:
          type: string
          description: 标签名称
          example: GPT-5
        type:
          type: integer
          format: int64
          description: 标签类型
          example: 1

    Article:
      type: object
      description: 文章简要信息(列表项)
      properties:
        id:
          type: integer
          format: int64
          description: 文章ID
          example: 1
        title:
          type: string
          description: 文章标题
          example: GPT-5 发布：AI 能力再次飞跃，这些职业将受到影响
        summary:
          type: string
          description: AI生成摘要
          example: OpenAI 今日发布 GPT-5，在多个基准测试中取得突破性进展...
        category_id:
          type: integer
          description: 分类ID
          example: 1
        category_name:
          type: string
          description: 分类名称
          example: 动态
        source_id:
          type: integer
          format: int64
          description: 来源ID
          example: 1
        source_name:
          type: string
          description: 来源名称
          example: 机器之心
        author:
          type: string
          description: 作者
          example: AI观察
        published_at:
          type: string
          format: date-time
          description: 发布时间
          example: '2026-03-30T10:00:00Z'
        view_count:
          type: integer
          format: int64
          description: 阅读量
          example: 1234
        comment_count:
          type: integer
          format: int64
          description: 评论数
          example: 23
        tags:
          type: array
          description: 标签列表
          items:
            $ref: '#/components/schemas/Tag'

    ArticleDetail:
      type: object
      description: 文章详细信息
      allOf:
        - $ref: '#/components/schemas/Article'
        - type: object
          properties:
            content_mongo_id:
              type: string
              description: MongoDB正文ID(从MongoDB获取正文内容)
              example: 507f1f77bcf86cd799439011
            status:
              type: integer
              description: 状态(0-待审核, 1-已发布, 2-已删除)
              example: 1
            created_at:
              type: string
              format: date-time
              description: 创建时间
              example: '2026-03-30T10:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: 更新时间
              example: '2026-03-30T10:00:00Z'

# ============ 全局错误响应 ============
x-error-codes:
  200: 请求成功
  400: 请求参数错误
  401: 未授权或认证失败
  403: 权限不足
  404: 资源不存在
  500: 服务器内部错误
