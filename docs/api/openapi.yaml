          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathChapter'
    post:
      tags:
        - 管理后台
      summary: 创建章节
      operationId: createAdminChapter
      parameters:
        - name: path_id
          in: path
          description: 学习路径 ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateChapterRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathChapter'
  /admin/chapters/{id}:
    get:
      tags:
        - 管理后台
      summary: 获取章节详情
      operationId: getAdminChapterById
      parameters:
        - name: id
          in: path
          description: 章节 ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathChapterDetail'
    put:
      tags:
        - 管理后台
      summary: 更新章节
      operationId: updateAdminChapter
      parameters:
        - name: id
          in: path
          description: 章节 ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateChapterRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathChapterDetail'
    delete:
      tags:
        - 管理后台
      summary: 删除章节
      operationId: deleteAdminChapter
      parameters:
        - name: id
          in: path
          description: 章节 ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证
  schemas:
    RegisterRequest:
      type: object
      description: 用户注册请求
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          format: password
          description: 密码
          minLength: 8
          maxLength: 32
          example: SecurePass123!
        nickname:
          type: string
          description: 用户昵称
          minLength: 2
          maxLength: 20
          example: 用户名
    LoginRequest:
      type: object
      description: 用户登录请求
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          format: password
          description: 密码
          example: SecurePass123!
    RefreshTokenRequest:
      type: object
      description: 刷新 Token 请求
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    RegisterResponse:
      type: object
      description: 注册响应
      properties:
        user_id:
          type: string
          description: 用户 ID
          example: user-123
        message:
          type: string
          description: 消息
          example: 注册成功，请登录
    LoginResponse:
      type: object
      description: 登录响应
      properties:
        access_token:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: 过期时间（秒）
          example: 86400
        user:
          $ref: '#/components/schemas/UserInfo'
    RefreshTokenResponse:
      type: object
      description: 刷新 Token 响应
      properties:
        access_token:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: 过期时间（秒）
          example: 86400
    CommonResponse:
      type: object
      description: 通用响应结构
      properties:
        code:
          type: integer
          description: 状态码
          example: 200
        message:
          type: string
          description: 消息
          example: 操作成功
        data:
          type: object
          description: 数据
          nullable: true
    UserInfo:
      type: object
      description: 用户基本信息
      properties:
        id:
          type: string
          description: 用户 ID
          example: user-123
        email:
          type: string
          format: email
          description: 邮箱
          example: user@example.com
        nickname:
          type: string
          description: 昵称
          example: 测试用户
        avatar:
          type: string
          description: 头像 URL
          example: ''
        roles:
          type: array
          description: 角色列表
          items:
            type: string
          example:
            - user
    UserDetail:
      type: object
      description: 用户详细信息
      properties:
        id:
          type: string
          description: 用户 ID
          example: user-123
        email:
          type: string
          format: email
          description: 邮箱
          example: user@example.com
        nickname:
          type: string
          description: 昵称
          example: 测试用户
        avatar:
          type: string
          description: 头像 URL
          example: https://example.com/avatar.jpg
        bio:
          type: string
          description: 个人简介
          example: 这是一个开发者
