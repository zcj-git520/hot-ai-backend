  /auth/send-registration-code:
    post:
      tags:
        - 认证
      summary: 发送注册验证码
      description: |-
        向指定邮箱发送注册验证码，用于验证邮箱所有权

        ## 限流规则
        - 同一邮箱 1 分钟内最多发送 1 次
        - 同一邮箱 1 小时内最多发送 5 次

        ## 验证码说明
        - 验证码为 6 位数字
        - 有效期 5 分钟
        - 一次性使用，验证后自动失效
      operationId: sendRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 需要验证的邮箱地址
                  example: user@example.com
            example:
              email: user@example.com
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 验证码已发送，请检查邮箱
                  email:
                    type: string
                    example: user@example.com
                  expires_in:
                    type: integer
                    description: 验证码有效期（秒）
                    example: 300
        '400':
          description: 请求参数错误或邮箱已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 400
                message: 该邮箱已注册
                data: null
        '429':
          description: 操作过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              example:
                code: 429
                message: 操作过于频繁，请稍后再试
                data: null
  /auth/send-verification-email:
    post:
      tags:
        - 认证
      summary: 发送验证邮件
      description: 向指定邮箱发送验证邮件，用于验证邮箱所有权
      operationId: sendVerificationEmail
      requestBody:
        required: true
        content:
          application/json:
