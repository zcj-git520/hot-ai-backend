                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 需要验证的邮箱地址
                  example: user@example.com
            example:
              email: user@example.com
      responses:
        '200':
          description: 邮件发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 验证邮件已发送，请检查邮箱
                  email:
                    type: string
                    example: user@example.com
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
